<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSMART Certificate</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body{
            background-color: #fff;
            font-family:'Inter', sans-serif;
        }

        .navbar-custom{
            background:#fff;
            padding:18px 20px; /* Reduced side padding for mobile */
            border-bottom:1px solid #ccc;
        }

        .gov-text{
            font-size:14px;
            font-weight:500;
            line-height:1.35;
            color:#1e3a8a;
        }

        .gov-text span{
            font-size:15px;
            color:#1f2937;
        }

        .nav-btn{
            font-size:14px;
            font-weight:500;
            padding:10px 15px;
            border-radius:25px;

        }

        .about-btn{
            border:none;
            background:white;
            color:#111;
        }

        .register-btn{
            border:1px solid #e91e63;
            color:#e91e63;
            background:white;
        }

        .login-btn{
            background:#e91e63;
            color:white;
            border:none;
        }

        .title-bar{
            background:#083b8a;
            color:white;
            text-align:center;
            font-size:52px;
            font-weight:bold;
            letter-spacing: 3px;
            padding:35px 0;
            margin-top: 10px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }

        .certificate-card{
            background:white;
            padding:40px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        .footer{
            background:#083b8a;
            color:white;
            padding:30px 0;
            text-align:center;
            margin-top:30px;
        }

        span{color: #b2aeae; font-weight: lighter; font-size: smaller;}
        #img-fluid{border-right:10px solid rgb(209, 202, 202);}

        /* Mobile specific adjustments to match screenshot exactly */
        @media (max-width: 768px) {
            .navbar-custom { padding: 10px 15px; }
            .title-bar { 
                font-size: 32px; /* Smaller font to match mobile proportions */
                letter-spacing: 1px;
                padding: 25px 0;
            }
            .certificate-card { padding: 15px; } /* Less padding so image is larger */
            /* Remove hover effects for register and login buttons */
}
/* Force buttons to keep their original look even on hover/active/focus */

/* Register Button */
.register-btn, 
.register-btn:hover, 
.register-btn:active, 
.register-btn:focus,
.register-btn:focus-visible {
    background-color: white !important;
    color: #e91e63 !important;
    border: 1px solid #e91e63 !important;
    outline: none !important;
    box-shadow: none !important;
    opacity: 1 !important; /* Prevents Bootstrap's slight dimming */
}

/* Login Button */
.login-btn, 
.login-btn:hover, 
.login-btn:active, 
.login-btn:focus,
.login-btn:focus-visible {
    background-color: #e91e63 !important;
    color: white !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    opacity: 1 !important;
}
        
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">

            <div class="d-flex align-items-center gap-3">
                <img src="images/logo1.svg" height="40">
                
                <div class="d-none d-md-block" style="width:1px;height:50px;background:#cfcfcf;"></div>
                
                <img src="images/govt._of_kerala.png" height="50" class="d-none d-md-block">
                
                <img src="images/lsgd.png" height="50" class="d-none d-md-block">

                <div class="gov-text d-none d-md-block">
                    Government of Kerala<br>
                    <span>Local Self Government Department</span>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button class="btn nav-btn about-btn"style="color:#083b8a;">About KSMART</button>
                
                <button class="btn nav-btn register-btn d-none d-md-block"style="width:150px;font-size:18px;">Register</button>
                <button class="btn nav-btn login-btn d-none d-md-block"style="width:150px;">Login</button>
            </div>

        </div>
    </nav>

    <div class="title-bar">
        Certificate
    </div>

    <div class="bg">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div id="img-fluid" class="col-12 col-lg-10">

                    <div style="margin-top:20px; padding-bottom:10px">
                        <div class="certificate-card">
                            <img src="images/front (1).jpg" class="img-fluid">
                        </div>
                    </div>

                    <div>
                        <div class="certificate-card">
                            <img src="images/cerificate2.jpeg" class="img-fluid">
                        </div>
                    </div>

                </div>
            </div>
        </div>
        
        <footer class="footer">
            Official Web Portal of Kerala Local Government, Government of Kerala,
            Owned by Local Self Government Department,
            Developed by Information Kerala Mission
            <br><br>
            <span>© Copyright 2023, All Rights Reserved by IKM</span>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
